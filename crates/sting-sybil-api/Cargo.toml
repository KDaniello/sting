[package]
name = "sting-sybil-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "The request path: an address in, a risk score out, served from a warm cache with no network call in the way."

[[bin]]
name = "sting-sybil-api"
path = "src/main.rs"

[dependencies]
sting-sybil-scorer = { workspace = true }
arrow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
toml = { workspace = true }
tower = { workspace = true, features = ["timeout", "limit", "load-shed", "util"] }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
serde_json = { workspace = true }

[lints]
workspace = true
