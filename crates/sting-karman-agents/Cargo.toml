[package]
name = "sting-karman-agents"
description = "The agent library: reusable behaviours for the workspace's mechanisms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Nothing here is published: this is a platform rather than a set of libraries, and a crate that
# says nothing about publication is a crate a lint asks for keywords it will never use.
publish = false

[dependencies]
sting-karman-core = { workspace = true }
sting-karman-mech-curve = { workspace = true }
sting-karman-mech-lending = { workspace = true }
sting-karman-mech-showcase = { workspace = true }
sting-karman-mech-vouch = { workspace = true }
sting-karman-types = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# The verification harnesses, so a level-2 measurement can be proven against a real mechanism
# and a real population rather than against a series written to satisfy it.
sting-karman-verify = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
