[package]
name = "sting-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "sting"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sting-core = { workspace = true }
sting-corpus = { workspace = true }
sting-emulator = { workspace = true }
sting-pipeline = { workspace = true }
sting-bench = { workspace = true }
clap = { version = "4.6.2", features = ["derive"] }
sting-detectors = { workspace = true }
anyhow = "1.0.103"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
