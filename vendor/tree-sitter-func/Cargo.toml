[package]
name = "tree-sitter-func"
description = "FunC grammar for tree-sitter — vendored fork, see README.md"
version = "1.0.0"
authors = [
	"akifoq <akifoq@protonmail.com>",
	"Amaan Qureshi <amaanq12@gmail.com>",
	"Dan Volkov <die.marmelade@yandex.ru>",
]
license = "MIT"
repository = "https://github.com/tree-sitter-grammars/tree-sitter-func"
edition = "2021"
publish = false
autoexamples = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.26"

[build-dependencies]
cc = "1.0"
