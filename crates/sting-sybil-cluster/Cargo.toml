[package]
name = "sting-sybil-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Who belongs together by topology: components of the funding graph, with the giant one broken down into its dense cores."

[[bin]]
name = "sting-sybil-cluster"
path = "src/main.rs"

[dependencies]
sting-sybil-graph = { workspace = true }
sting-sybil-ingestion = { workspace = true }
sting-sybil-store = { workspace = true }
sting-sybil-types = { workspace = true }
arrow = { workspace = true }
clap = { workspace = true, features = ["env"] }
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
parquet = { workspace = true, features = ["arrow"] }

[lints]
workspace = true
