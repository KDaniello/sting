# Conformance golden run: Cpamm 1_000_000_000/1_000_000_000, one CoinFlipTrader,
# 500 ticks, seed 42, stream 0. Produced by `conformance_golden` in sting-karman-mech-curve.
[cpamm]
golden_token_reserve = 990255899
golden_quote_reserve = 1009840231

# Conformance golden run: one lending market at 80% LLTV, a tenth of interest to the fee
# recipient, ten percent a year, twelve seconds a tick, eight Participants, 500 ticks, seed 42,
# stream 0. Produced by `conformance_golden` in sting-karman-mech-lending. The run applied 3167 actions
# and refused 833, so these pin a market that was built up and unwound rather than one that
# stood still.
[lending]
golden_supply_assets = 14277386
golden_supply_shares = 14276927103005
golden_borrow_assets = 5305708
golden_borrow_shares = 5306141667469

# Liquidation cascade: the same market, priced at parity until the fiftieth tick and thirty
# percent lower from then on. One lender, four borrowers opening at 79% of an 80% threshold, one
# liquidator that keeps trying. 200 ticks, seed 42, stream 0. Produced by
# `a_seeded_cascade_writes_off_debt_only_when_collateral_runs_out` in sting-karman-mech-lending. What
# gates is that both outcomes occur — liquidations that leave collateral behind write nothing
# off, and the ones that take the last of it write off everything still owed.
cascade_written_off = 528006472
cascade_liquidations = 7
cascade_write_offs = 4
cascade_supply_assets = 3472000013
cascade_interest = 6485

# The engine against the cadCAD reference on the shared scenario, by
# `python/reference/compare.py`. The gap and the threshold are the two-sample Kolmogorov-Smirnov
# statistic and its five-percent critical value, in ten-thousandths; what gates is that the gap
# stays under the threshold, and that the same test rejects a reference with a different
# population. The seconds are one host's and gate nothing (karman/docs/PROFILER.md).
[reference.cpamm_smoke]
runs = 1000
ticks = 500
seed = 42
largest_gap_ten_thousandths = 480
threshold_ten_thousandths = 607
gap_against_a_different_population_ten_thousandths = 920
engine_milliseconds = 10
cadcad_milliseconds = 1580
