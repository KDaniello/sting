# Every number a gate names, written here the moment it is measured, with the
# command that produced it and the host it ran on. A number quoted in a
# document and absent from this file is a number nobody can check
# (docs/ROADMAP.md §14).
#
# An entry carrying `fact` is checked against the tree by
# `scripts/doc-numbers.py`, which derives that fact from the code. `direction`
# says what the entry promises: `at_least` is a floor the tree must not fall
# below, `at_most` a ceiling, `exact` a value that must not move at all. The
# number itself stays what the gate was passed with — a file rewritten on every
# new test is a copy of the tree, not a record.
#
# An entry without a `fact` is a measurement no script can rederive. It names
# the command instead.
#
# Below the milestones are the golden runs: a mechanism's own numbers, pinned by the test that
# produces them. A golden value changes only together with the change that legitimately moved it,
# and the commit message says why. They live here rather than in a second file called the same
# thing in a second workspace — which is what they were, and which is how one of them was read by
# the other's reader after the merge.

