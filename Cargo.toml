[workspace]
resolver = "3"
members = [
    "crates/sting-core",
    "crates/sting-ast",
    "crates/sting-dataflow",
    "crates/sting-semantic",
    "crates/sting-detectors",
    "crates/sting-report",
    "crates/sting-emulator-sys",
    "crates/sting-emulator",
    "crates/sting-tolkc",
    "crates/sting-fift",
    "crates/sting-address",
    "crates/sting-chain",
    "crates/sting-tep",
    "crates/sting-corpus",
    "crates/sting-pipeline",
    "crates/sting-bench",
    "crates/sting-benchmark",
    "crates/sting-hunt",
    "crates/sting-fuzz",
    "crates/sting-cli",
    "crates/sting-abi-core",
    "crates/sting-abi-tolk",
    "crates/sting-abi-tact",
    "crates/sting-abi-func",
    "crates/sting-abi-registry",
    "crates/sting-abi-pipeline",
    "crates/sting-abi-service",
    "crates/sting-abi-cli",
    "crates/sting-abi-bench",
    "crates/sting-abi-decode",
    "crates/sting-load",
    "crates/sting-abi-dictionary",
    "crates/sting-abi-profiler",
    "crates/sting-abi-coverage",
    "crates/sting-scamcheck",
    "crates/sting-sybil-types",
    "crates/sting-sybil-ingestion",
    "crates/sting-sybil-graph",
    "crates/sting-sybil-store",
    "crates/sting-sybil-features",
    "crates/sting-sybil-cluster",
    "crates/sting-sybil-scorer",
    "crates/sting-sybil-api",
    "crates/sting-sybil-python",
    "crates/sting-karman-types",
    "crates/sting-karman-core",
    "crates/sting-karman-tvm",
    "crates/sting-karman-mech-curve",
    "crates/sting-karman-mech-lending",
    "crates/sting-karman-mech-perp",
    "crates/sting-karman-mech-showcase",
    "crates/sting-karman-mech-vouch",
    "crates/sting-karman-agents",
    "crates/sting-karman-scenario",
    "crates/sting-karman-data",
    "crates/sting-karman-report",
    "crates/sting-karman-verify",
    "crates/sting-karman-app",
    "crates/sting-karman-cli",
    "crates/sting-karman-python",
]
# One directory stays outside, and it is the one `DECISIONS.md` §6 puts there: `karman` holds the
# reference implementation on an EVM runtime, which would drag `revm` and `alloy` into a platform
# that has no use for either. Nothing else is excluded — `tools/` is Python and was never a member.
exclude = ["karman"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The toolchain `rust-toolchain.toml` pins, said again where a crate can inherit it: a crate that
# names its own is a crate that can be built by a compiler the rest of the tree refuses.
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KDaniello/sting"
authors = ["Daniel"]
publish = false

# One version per dependency, for every dependency more than one member uses. Two manifests pinning
# the same crate differently do not break a build — `Cargo.lock` unifies them — so the drift is
# invisible until a feature flag or an advisory makes it matter, which is why it is prevented here
# rather than watched for. Internal `sting-*` crates are listed for the same reason: each is a
# dependency of at least one other member. A dependency exactly one crate uses stays in that crate.
[workspace.dependencies]
sting-core = { path = "crates/sting-core", version = "0.0.0" }
sting-ast = { path = "crates/sting-ast", version = "0.0.0" }
sting-dataflow = { path = "crates/sting-dataflow", version = "0.0.0" }
sting-semantic = { path = "crates/sting-semantic", version = "0.0.0" }
sting-detectors = { path = "crates/sting-detectors", version = "0.0.0" }
sting-report = { path = "crates/sting-report", version = "0.0.0" }
sting-emulator-sys = { path = "crates/sting-emulator-sys", version = "0.0.0" }
sting-emulator = { path = "crates/sting-emulator", version = "0.0.0" }
sting-tolkc = { path = "crates/sting-tolkc", version = "0.0.0" }
sting-fift = { path = "crates/sting-fift", version = "0.0.0" }
sting-address = { path = "crates/sting-address", version = "0.0.0" }
sting-chain = { path = "crates/sting-chain", version = "0.0.0" }
sting-tep = { path = "crates/sting-tep", version = "0.0.0" }
sting-corpus = { path = "crates/sting-corpus", version = "0.0.0" }
sting-pipeline = { path = "crates/sting-pipeline", version = "0.0.0" }
sting-bench = { path = "crates/sting-bench", version = "0.0.0" }
sting-benchmark = { path = "crates/sting-benchmark", version = "0.0.0" }
sting-hunt = { path = "crates/sting-hunt", version = "0.0.0" }
sting-abi-core = { path = "crates/sting-abi-core", version = "0.0.0" }
sting-abi-tolk = { path = "crates/sting-abi-tolk", version = "0.0.0" }
sting-abi-tact = { path = "crates/sting-abi-tact", version = "0.0.0" }
sting-abi-func = { path = "crates/sting-abi-func", version = "0.0.0" }
sting-abi-registry = { path = "crates/sting-abi-registry", version = "0.0.0" }
sting-abi-pipeline = { path = "crates/sting-abi-pipeline", version = "0.0.0" }
sting-abi-bench = { path = "crates/sting-abi-bench", version = "0.0.0" }
sting-abi-decode = { path = "crates/sting-abi-decode", version = "0.0.0" }
sting-load = { path = "crates/sting-load", version = "0.0.0" }
sting-abi-dictionary = { path = "crates/sting-abi-dictionary", version = "0.0.0" }
sting-abi-coverage = { path = "crates/sting-abi-coverage", version = "0.0.0" }
sting-scamcheck = { path = "crates/sting-scamcheck", version = "0.0.0" }
sting-sybil-types = { path = "crates/sting-sybil-types", version = "0.0.0" }
sting-sybil-ingestion = { path = "crates/sting-sybil-ingestion", version = "0.0.0" }
sting-sybil-graph = { path = "crates/sting-sybil-graph", version = "0.0.0" }
sting-sybil-store = { path = "crates/sting-sybil-store", version = "0.0.0" }
sting-sybil-features = { path = "crates/sting-sybil-features", version = "0.0.0" }
sting-sybil-cluster = { path = "crates/sting-sybil-cluster", version = "0.0.0" }
sting-sybil-scorer = { path = "crates/sting-sybil-scorer", version = "0.0.0" }
sting-sybil-api = { path = "crates/sting-sybil-api", version = "0.0.0" }
sting-sybil-python = { path = "crates/sting-sybil-python", version = "0.0.0" }
sting-karman-types = { path = "crates/sting-karman-types", version = "0.0.0" }
sting-karman-core = { path = "crates/sting-karman-core", version = "0.0.0" }
sting-karman-tvm = { path = "crates/sting-karman-tvm", version = "0.0.0" }
sting-karman-mech-curve = { path = "crates/sting-karman-mech-curve", version = "0.0.0" }
sting-karman-mech-lending = { path = "crates/sting-karman-mech-lending", version = "0.0.0" }
sting-karman-mech-perp = { path = "crates/sting-karman-mech-perp", version = "0.0.0" }
sting-karman-mech-showcase = { path = "crates/sting-karman-mech-showcase", version = "0.0.0" }
sting-karman-mech-vouch = { path = "crates/sting-karman-mech-vouch", version = "0.0.0" }
sting-karman-agents = { path = "crates/sting-karman-agents", version = "0.0.0" }
sting-karman-scenario = { path = "crates/sting-karman-scenario", version = "0.0.0" }
sting-karman-data = { path = "crates/sting-karman-data", version = "0.0.0" }
sting-karman-report = { path = "crates/sting-karman-report", version = "0.0.0" }
sting-karman-verify = { path = "crates/sting-karman-verify", version = "0.0.0" }
sting-karman-app = { path = "crates/sting-karman-app", version = "0.0.0" }

axum = "0.8.7"
base64 = "0.23.1"
dirs = "7.0.0"
dotenvy = "0.15.7"
hex = "0.4.3"
proptest = "1.11.0"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.40.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.0", default-features = false }
toml = "1.1.3"
tonlib-core = "0.26.11"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tower-http = "0.7.1"
tower = "0.5.2"
# The seeded stream every simulated run draws from. One generation, deliberately: a different
# generation is a different seed semantics, which is a different determinism, and reproducibility
# by seed is a discipline this platform states rather than hopes for.
rand_chacha = "0.10"
rand_core = "0.10"
clap = { version = "4.6.2", features = ["derive"] }
arrow = "60.1.0"
clickhouse = "0.15.1"
futures = "0.3.31"
insta = "1.48.0"
num-bigint = "0.5.1"
parquet = "60.1.0"
petgraph = "0.8.3"
# One ABI for the platform's two extension modules. 3.11 rather than something older because the
# Arrow bridge hands a table over through the buffer protocol, and the limited API only carries
# that from 3.11 onwards — a lower floor would build one module and refuse the other.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pyo3-arrow = "0.19.0"
tree-sitter = "0.26.11"
ureq = { version = "3.3.0", features = ["json"] }
wait-timeout = "0.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
multiple_crate_versions = "allow"
module_name_repetitions = "allow"

[profile.release]
panic = "unwind"
